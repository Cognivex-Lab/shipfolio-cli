version: 2
project_name: shipfolio

builds:
  - main: ./cmd/shipfolio
    binary: shipfolio
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/Cognivex-Lab/shipfolio-cli/internal/cli.Version=v{{ .Version }}

archives:
  - name_template: "shipfolio_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
